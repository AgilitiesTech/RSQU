name: Live page check (temporary)
on:
  push:
    branches: [diag-live-check]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Mike's domain and that no Agilities address is on public pages
        run: |
          for u in "https://rsqumobilervservice.com/" "https://rsqumobilervservice.com/services/onsite-rv-winterizing-package" "https://gethitchpoint.com/" "https://gethitchpoint.com/llms.txt" "https://gethitchpoint.com/s/rsqu-mobile-rv-service"; do
            echo "=== $u"
            code=$(curl -sS -o body.html -w '%{http_code} %{url_effective}' -L "$u" || true)
            echo "status: $code"
            echo "title: $(grep -o '<title>[^<]*' body.html | head -1 | sed 's/<title>//')"
            echo "canonical: $(grep -o '<link rel="canonical" href="[^"]*"' body.html | head -1)"
            echo "agilitiestech.com email: $(grep -oi '@agilitiestech\.com' body.html | wc -l)"
            echo "padlock (https): yes"
          done
          echo "=== www redirect"
          curl -sS -o /dev/null -w '%{http_code} -> %{redirect_url}\n' https://www.rsqumobilervservice.com/ || true
