name: Live page check (temporary)
on:
  push:
    branches: [diag-live-check]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check the blog and Q&A update is live (counts only)
        run: |
          echo "healthz: $(curl -sS https://gethitchpoint.com/healthz || true)"
          curl -sS -o site.js https://gethitchpoint.com/static/site.js || true
          echo "site.js ask-form mentions: $(grep -c 'ask-form' site.js)"
          curl -sS -o admin.js https://gethitchpoint.com/admin/admin.js || curl -sS -o admin.js https://gethitchpoint.com/static/admin.js || true
          echo "admin.js questionsView mentions: $(grep -c 'questionsView' admin.js)"
          for u in "https://rsqumobilervservice.com/" "https://gethitchpoint.com/s/rsqu-mobile-rv-service" "https://rsqumobilervservice.com/questions" "https://rsqumobilervservice.com/blog"; do
            code=$(curl -sS -o body.html -w '%{http_code}' "$u" || true)
            echo "=== $u -> $code; title: $(grep -o '<title>[^<]*' body.html | head -1 | sed 's/<title>//'); Q&A link: $(grep -c '/questions"' body.html); Blog link: $(grep -c '/blog"' body.html)"
          done
