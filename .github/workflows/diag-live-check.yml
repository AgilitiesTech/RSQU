name: Live page check (temporary)
on:
  push:
    branches: [diag-live-check]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check the lead-source update is live (counts only)
        run: |
          echo "healthz: $(curl -sS https://gethitchpoint.com/healthz || true)"
          curl -sS -o site.js https://gethitchpoint.com/static/site.js || true
          echo "site.js hpLeadSource mentions: $(grep -c 'hpLeadSource' site.js); hp-track mentions: $(grep -c 'hp-track' site.js)"
          curl -sS -o admin.js https://gethitchpoint.com/admin/admin.js || true
          echo "admin.js requests.csv mentions: $(grep -c 'requests.csv' admin.js); w-ga4 mentions: $(grep -c 'w-ga4' admin.js)"
          for u in "https://rsqumobilervservice.com/" "https://gethitchpoint.com/s/rsqu-mobile-rv-service" "https://rsqumobilervservice.com/services/onsite-rv-winterizing-package"; do
            code=$(curl -sS -D headers.txt -o body.html -w '%{http_code}' "$u" || true)
            echo "=== $u -> $code; title: $(grep -o '<title>[^<]*' body.html | head -1 | sed 's/<title>//'); heard_about field: $(grep -c 'name="heard_about"' body.html); email field: $(grep -c 'name="email" type="email"' body.html); hp-track block: $(grep -c 'id="hp-track"' body.html); CSP googletagmanager: $(grep -ci 'content-security-policy:.*googletagmanager' headers.txt)"
          done
          code=$(curl -sS -o /dev/null -w '%{http_code}' https://rsqumobilervservice.com/services/slides || true)
          echo "=== /services/slides -> $code (302 until the service page script runs)"
