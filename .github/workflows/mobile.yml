# Builds the HitchPoint phone apps (mobile/) to check they compile, and makes an Android test app
# (an .apk you can install on an Android phone) available to download from the run's page.
# Nothing here is signed for the stores or uploaded anywhere; store builds come later, once the
# Apple and Google accounts exist (see mobile/README.md).
name: Phone apps

on:
  workflow_dispatch:
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/mobile.yml']

permissions:
  contents: read

jobs:
  android:
    name: Android test app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - name: Build the test app
        run: ./gradlew assembleDebug --no-daemon
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: HitchPoint-android-test
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  ios:
    name: iPhone build check
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx cap sync ios
      - name: Build for the iPhone simulator (no signing)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40
          exit ${PIPESTATUS[0]}
