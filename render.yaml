# Render blueprint: New > Blueprint, point it at this repo.
services:
  - type: web
    name: rsqu-admin
    runtime: docker
    rootDir: admin
    plan: starter            # a persistent disk needs a paid plan
    healthCheckPath: /healthz
    disk:
      name: rsqu-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://agilitiestech.github.io
      - key: BASE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: NOTIFY_SMS_TO
        sync: false
