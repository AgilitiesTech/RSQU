# Render blueprint: New > Blueprint, point it at this repo.
services:
  - type: web
    name: rsqu-admin
    runtime: docker
    # The app lives in the admin/ folder; paths are relative to the repo root.
    dockerfilePath: ./admin/Dockerfile
    dockerContext: ./admin
    plan: starter            # a persistent disk needs a paid plan
    healthCheckPath: /healthz
    disk:
      name: rsqu-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: SUPER_ADMIN_EMAIL
        value: aaron@agilitiestech.com
      - key: PLATFORM_CONTACT_EMAIL
        value: aaron@agilitiestech.com
      - key: PLATFORM_URL
        value: https://gethitchpoint.com
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: BASE_URL
        value: https://gethitchpoint.com
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_CONNECT_WEBHOOK_SECRET
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
